<style>
:root{--bg:#f4f6f8;--fg:#14202b;--mut:#4b5b69;--ac:#0b5cad;--err:#b3261e;--card:#fff;--bd:#c9d3dc}
@media (prefers-color-scheme:dark){:root{--bg:#0f1720;--fg:#e8eef4;--mut:#a7b5c2;--ac:#6fb1f2;--err:#ff8a80;--card:#17222e;--bd:#33465a}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif;padding:16px}

@media (prefers-color-scheme:dark){button{color:#0f1720}}
button:disabled{opacity:.6;cursor:wait}input:focus-visible,button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
#msg{min-height:1.4em;margin-top:12px;color:var(--err);font-size:.9rem}
</style></head><body><main>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
document.getElementById("f").addEventListener("submit",async e=>{
  e.preventDefault();go();});
async function go(){
  const btn=document.getElementById("b"),msg=document.getElementById("msg"),inp=document.getElementById("c");
  btn.disabled=true;msg.textContent="Verificando…";
  try{
    const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(inp.value),"PBKDF2",false,["deriveKey"]);
    const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(P.s),iterations:P.n,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    const gz=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(P.i)},key,b64(P.d));
    const html=await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    document.open();document.write(html);document.close();
  }catch(_){msg.textContent="Código incorrecto.";btn.disabled=false;inp.select();}
}
const H=decodeURIComponent(location.hash.slice(1));
